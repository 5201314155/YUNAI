# 🌍 YUNAI 生产环境配置
# 完整的运营级配置，支持多云部署和高可用

app:
  name: "YUNAI"
  version: "2.0.0"
  environment: "production"
  debug: false
  port: 8080
  
# 🗄️ 多重数据存储配置
storage:
  strategy: "multi_tier"
  
  # 主数据库集群
  primary_database:
    type: "postgresql"
    master:
      host: "${DB_MASTER_HOST:localhost}"
      port: "${DB_MASTER_PORT:5432}"
      database: "${DB_NAME:yunai}"
      username: "${DB_USERNAME:postgres}"
      password: "${DB_PASSWORD:123456}"
      ssl_mode: "require"
      max_connections: 100
      connection_timeout: 30
    
    # 只读副本
    replicas:
      - host: "${DB_REPLICA1_HOST:localhost}"
        port: "${DB_REPLICA1_PORT:5433}"
        weight: 1
      - host: "${DB_REPLICA2_HOST:localhost}"
        port: "${DB_REPLICA2_PORT:5434}"
        weight: 1
    
    # 分片配置
    sharding:
      enabled: true
      strategy: "user_id_hash"
      shards: 4
  
  # 缓存层配置
  cache:
    # L1: 内存缓存
    memory:
      enabled: true
      max_size: "512MB"
      ttl: 300
    
    # L2: Redis集群
    redis:
      enabled: true
      cluster:
        - host: "${REDIS_HOST1:localhost}"
          port: "${REDIS_PORT1:6379}"
        - host: "${REDIS_HOST2:localhost}"
          port: "${REDIS_PORT2:6380}"
        - host: "${REDIS_HOST3:localhost}"
          port: "${REDIS_PORT3:6381}"
      password: "${REDIS_PASSWORD:}"
      db: 0
      pool_size: 50
      ttl: 3600
    
    # L3: 分布式缓存
    distributed:
      enabled: true
      provider: "hazelcast"
      nodes:
        - "${HAZELCAST_NODE1:localhost:5701}"
        - "${HAZELCAST_NODE2:localhost:5702}"
  
  # 对象存储配置
  object_storage:
    primary:
      provider: "aws_s3"
      bucket: "${S3_BUCKET:yunai-production}"
      region: "${S3_REGION:us-west-2}"
      access_key: "${AWS_ACCESS_KEY}"
      secret_key: "${AWS_SECRET_KEY}"
    
    backup:
      provider: "aliyun_oss"
      bucket: "${OSS_BUCKET:yunai-backup}"
      region: "${OSS_REGION:oss-cn-hangzhou}"
      access_key: "${ALIYUN_ACCESS_KEY}"
      secret_key: "${ALIYUN_SECRET_KEY}"
  
  # 搜索引擎
  search:
    provider: "elasticsearch"
    cluster:
      - host: "${ES_HOST1:localhost}"
        port: "${ES_PORT1:9200}"
      - host: "${ES_HOST2:localhost}"
        port: "${ES_PORT2:9201}"
    username: "${ES_USERNAME:elastic}"
    password: "${ES_PASSWORD:}"
    index_prefix: "yunai_prod"

# 🤖 AI模型配置
models:
  # 默认模型提供商
  default_provider: "siliconflow"
  
  # 模型提供商配置
  providers:
    siliconflow:
      api_key: "${SILICONFLOW_API_KEY}"
      base_url: "https://api.siliconflow.cn/v1"
      rate_limit: 1000
      timeout: 30
      retry_count: 3
    
    openai:
      api_key: "${OPENAI_API_KEY}"
      base_url: "https://api.openai.com/v1"
      rate_limit: 500
      timeout: 30
      retry_count: 3
    
    anthropic:
      api_key: "${ANTHROPIC_API_KEY}"
      base_url: "https://api.anthropic.com/v1"
      rate_limit: 300
      timeout: 30
      retry_count: 3
  
  # 功能模型映射
  function_models:
    chat:
      primary: "deepseek-ai/DeepSeek-V3"
      fallback: ["Qwen/Qwen2.5-72B-Instruct", "gpt-4"]
    
    moments:
      primary: "claude-3-sonnet"
      fallback: ["deepseek-ai/DeepSeek-V3"]
    
    story:
      primary: "deepseek-ai/DeepSeek-V3"
      fallback: ["claude-3-sonnet"]
    
    embedding:
      primary: "BAAI/bge-large-zh-v1.5"
      fallback: ["text-embedding-3-large"]
    
    tts:
      primary: "fishaudio/fish-speech-1.4"
      fallback: ["FunAudioLLM/CosyVoice2-0.5B"]
  
  # 负载均衡配置
  load_balancing:
    strategy: "weighted_round_robin"
    health_check:
      enabled: true
      interval: 30
      timeout: 5
      failure_threshold: 3
    
    circuit_breaker:
      enabled: true
      failure_rate: 0.5
      timeout: 60

# 🌍 CDN和网络配置
network:
  # CDN配置
  cdn:
    enabled: true
    providers:
      - name: "cloudflare"
        zone_id: "${CLOUDFLARE_ZONE_ID}"
        api_token: "${CLOUDFLARE_API_TOKEN}"
        priority: 1
      
      - name: "aliyun_cdn"
        domain: "${ALIYUN_CDN_DOMAIN}"
        access_key: "${ALIYUN_CDN_ACCESS_KEY}"
        secret_key: "${ALIYUN_CDN_SECRET_KEY}"
        priority: 2
    
    cache_rules:
      static_assets:
        ttl: 86400  # 24小时
        patterns: ["*.js", "*.css", "*.png", "*.jpg", "*.woff2"]
      
      api_responses:
        ttl: 300    # 5分钟
        patterns: ["/api/models", "/api/characters"]
      
      user_content:
        ttl: 3600   # 1小时
        patterns: ["/api/moments/*", "/api/voice/*"]
  
  # 负载均衡器
  load_balancer:
    type: "nginx"
    upstream_servers:
      - server: "${APP_SERVER1:localhost:8080}"
        weight: 1
        max_fails: 3
        fail_timeout: 30
      - server: "${APP_SERVER2:localhost:8081}"
        weight: 1
        max_fails: 3
        fail_timeout: 30
    
    health_check:
      uri: "/health"
      interval: 10
      timeout: 5

# 🔐 安全配置
security:
  # JWT配置
  jwt:
    secret: "${JWT_SECRET}"
    expiry: 86400  # 24小时
    refresh_expiry: 604800  # 7天
  
  # 加密配置
  encryption:
    algorithm: "AES-256-GCM"
    key: "${ENCRYPTION_KEY}"
  
  # CORS配置
  cors:
    allowed_origins: ["https://yunai.com", "https://app.yunai.com"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Authorization", "Content-Type", "X-Requested-With"]
    max_age: 86400
  
  # 限流配置
  rate_limiting:
    enabled: true
    requests_per_minute: 1000
    burst_size: 100
    
    # 按用户限流
    per_user:
      requests_per_minute: 60
      burst_size: 10
    
    # 按IP限流
    per_ip:
      requests_per_minute: 300
      burst_size: 50

# 📊 监控和日志
monitoring:
  # 指标收集
  metrics:
    enabled: true
    provider: "prometheus"
    endpoint: "/metrics"
    interval: 15
    
    # 自定义指标
    custom_metrics:
      - name: "yunai_user_active_total"
        type: "counter"
        help: "Total number of active users"
      
      - name: "yunai_model_request_duration"
        type: "histogram"
        help: "Model request duration in seconds"
      
      - name: "yunai_chat_messages_total"
        type: "counter"
        help: "Total number of chat messages"
  
  # 链路追踪
  tracing:
    enabled: true
    provider: "jaeger"
    endpoint: "${JAEGER_ENDPOINT:http://localhost:14268/api/traces}"
    sample_rate: 0.1
  
  # 健康检查
  health_check:
    enabled: true
    endpoints:
      - path: "/health"
        checks: ["database", "redis", "models"]
      - path: "/ready"
        checks: ["basic"]
  
  # 日志配置
  logging:
    level: "info"
    format: "json"
    output: "stdout"
    
    # 日志轮转
    rotation:
      enabled: true
      max_size: "100MB"
      max_files: 10
      max_age: 30
    
    # 日志聚合
    aggregation:
      enabled: true
      provider: "elasticsearch"
      index: "yunai-logs"

# 💰 商业化配置
business:
  # 支付配置
  payment:
    providers:
      - name: "stripe"
        public_key: "${STRIPE_PUBLIC_KEY}"
        secret_key: "${STRIPE_SECRET_KEY}"
        webhook_secret: "${STRIPE_WEBHOOK_SECRET}"
      
      - name: "alipay"
        app_id: "${ALIPAY_APP_ID}"
        private_key: "${ALIPAY_PRIVATE_KEY}"
        public_key: "${ALIPAY_PUBLIC_KEY}"
    
    # 订阅计划
    subscription_plans:
      basic:
        name: "基础版"
        price: 0
        features: ["基础聊天", "1个AI角色", "每日10次对话"]
      
      premium:
        name: "高级版"
        price: 29
        features: ["无限聊天", "5个AI角色", "朋友圈功能", "语音通话"]
      
      pro:
        name: "专业版"
        price: 99
        features: ["所有功能", "无限AI角色", "自定义模型", "API访问"]
  
  # 用户增长
  growth:
    referral:
      enabled: true
      reward_type: "credits"
      reward_amount: 100
      minimum_payout: 500
    
    analytics:
      provider: "mixpanel"
      project_token: "${MIXPANEL_TOKEN}"
      track_events: ["user_signup", "subscription", "chat_message", "voice_call"]

# 🚀 部署配置
deployment:
  # 容器配置
  container:
    image: "yunai/backend:latest"
    replicas: 3
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
  
  # 自动扩缩容
  autoscaling:
    enabled: true
    min_replicas: 2
    max_replicas: 10
    target_cpu_utilization: 70
    target_memory_utilization: 80
  
  # 滚动更新
  rolling_update:
    max_unavailable: 1
    max_surge: 1
    
  # 环境变量
  environment:
    NODE_ENV: "production"
    LOG_LEVEL: "info"
    ENABLE_METRICS: "true"
    ENABLE_TRACING: "true"
