<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 YUNAI完整功能测试平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .test-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .test-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .card-icon {
            font-size: 2em;
            margin-right: 15px;
        }
        
        .card-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }
        
        .card-subtitle {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        
        .test-controls {
            margin-bottom: 15px;
        }
        
        .control-group {
            margin-bottom: 10px;
        }
        
        .control-label {
            display: block;
            font-size: 0.9em;
            color: #555;
            margin-bottom: 5px;
        }
        
        .control-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9em;
        }
        
        .control-select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9em;
            background: white;
        }
        
        .control-textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9em;
            resize: vertical;
            min-height: 60px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 5px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a6fd8;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-warning {
            background: #ffc107;
            color: #212529;
        }
        
        .btn-warning:hover {
            background: #e0a800;
        }
        
        .btn-info {
            background: #17a2b8;
            color: white;
        }
        
        .btn-info:hover {
            background: #138496;
        }
        
        .test-result {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .result-item {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.85em;
        }
        
        .result-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .result-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .result-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .character-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5em;
            margin: 10px auto;
        }
        
        .chat-preview {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .chat-message {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }
        
        .chat-user {
            background: #667eea;
            color: white;
            margin-left: 20px;
            text-align: right;
        }
        
        .chat-ai {
            background: white;
            color: #333;
            margin-right: 20px;
            border: 1px solid #ddd;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-online {
            background: #28a745;
        }
        
        .status-offline {
            background: #dc3545;
        }
        
        .status-busy {
            background: #ffc107;
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .feature-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .feature-item:hover {
            background: #e9ecef;
            transform: scale(1.05);
        }
        
        .feature-icon {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        
        .feature-name {
            font-size: 0.85em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌟 YUNAI完整功能测试平台</h1>
            <p>测试单聊、群聊、朋友圈、关系网、世界观、角色系统等所有核心功能</p>
        </div>
        
        <div class="test-grid">
            <!-- 单聊测试 -->
            <div class="test-card">
                <div class="card-header">
                    <div class="card-icon">💬</div>
                    <div>
                        <div class="card-title">单聊测试</div>
                        <div class="card-subtitle">一对一聊天，自动获取角色背景</div>
                    </div>
                </div>
                
                <div class="test-controls">
                    <div class="control-group">
                        <label class="control-label">选择聊天角色</label>
                        <select class="control-select" id="singleChatCharacter">
                            <option value="xiaoyu">小雨 - 温柔善良的AI助手</option>
                            <option value="xiaoming">小明 - 阳光开朗的大学生</option>
                            <option value="teacher_wang">王老师 - 经验丰富的教师</option>
                            <option value="doctor_li">李医生 - 专业的医疗专家</option>
                            <option value="artist_chen">陈画家 - 富有创意的艺术家</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">聊天消息</label>
                        <input type="text" class="control-input" id="singleChatMessage" 
                               placeholder="输入你想说的话..." value="你好，最近怎么样？">
                    </div>
                </div>
                
                <div>
                    <button class="btn btn-primary" onclick="testSingleChat()">开始单聊</button>
                    <button class="btn btn-info" onclick="getCharacterBackground()">获取角色背景</button>
                    <button class="btn btn-warning" onclick="switchCharacterAvatar()">切换角色图</button>
                </div>
                
                <div class="character-avatar" id="singleChatAvatar">🤖</div>
                
                <div class="test-result" id="singleChatResult">
                    <div class="result-info">等待测试...</div>
                </div>
            </div>
            
            <!-- 群聊测试 -->
            <div class="test-card">
                <div class="card-header">
                    <div class="card-icon">👥</div>
                    <div>
                        <div class="card-title">群聊测试</div>
                        <div class="card-subtitle">多人聊天，设置群聊背景</div>
                    </div>
                </div>
                
                <div class="test-controls">
                    <div class="control-group">
                        <label class="control-label">群聊场景</label>
                        <select class="control-select" id="groupChatScene">
                            <option value="classroom">教室讨论 - 学术氛围</option>
                            <option value="office">办公室 - 工作环境</option>
                            <option value="cafe">咖啡厅 - 休闲聊天</option>
                            <option value="park">公园 - 户外活动</option>
                            <option value="library">图书馆 - 安静学习</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">参与角色 (多选)</label>
                        <div class="feature-grid">
                            <div class="feature-item" onclick="toggleGroupMember('xiaoyu')">
                                <div class="feature-icon">🤖</div>
                                <div class="feature-name">小雨</div>
                            </div>
                            <div class="feature-item" onclick="toggleGroupMember('xiaoming')">
                                <div class="feature-icon">👨‍🎓</div>
                                <div class="feature-name">小明</div>
                            </div>
                            <div class="feature-item" onclick="toggleGroupMember('teacher_wang')">
                                <div class="feature-icon">👩‍🏫</div>
                                <div class="feature-name">王老师</div>
                            </div>
                            <div class="feature-item" onclick="toggleGroupMember('doctor_li')">
                                <div class="feature-icon">👨‍⚕️</div>
                                <div class="feature-name">李医生</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">群聊话题</label>
                        <input type="text" class="control-input" id="groupChatTopic" 
                               placeholder="输入讨论话题..." value="大家觉得AI技术的发展怎么样？">
                    </div>
                </div>
                
                <div>
                    <button class="btn btn-primary" onclick="testGroupChat()">开始群聊</button>
                    <button class="btn btn-success" onclick="setGroupBackground()">设置背景</button>
                    <button class="btn btn-warning" onclick="triggerGroupEvent()">触发事件</button>
                </div>
                
                <div class="test-result" id="groupChatResult">
                    <div class="result-info">等待测试...</div>
                </div>
            </div>
        </div>
        
        <div class="test-grid">
            <!-- 朋友圈测试 -->
            <div class="test-card">
                <div class="card-header">
                    <div class="card-icon">📱</div>
                    <div>
                        <div class="card-title">朋友圈测试</div>
                        <div class="card-subtitle">动态发布，互动评论</div>
                    </div>
                </div>
                
                <div class="test-controls">
                    <div class="control-group">
                        <label class="control-label">动态类型</label>
                        <select class="control-select" id="momentsType">
                            <option value="text">纯文字动态</option>
                            <option value="image">图片动态</option>
                            <option value="video">视频动态</option>
                            <option value="link">链接分享</option>
                            <option value="mood">心情状态</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">动态内容</label>
                        <textarea class="control-textarea" id="momentsContent" 
                                  placeholder="输入动态内容...">今天天气真好，心情也跟着好起来了！☀️</textarea>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">可见范围</label>
                        <select class="control-select" id="momentsVisibility">
                            <option value="public">公开</option>
                            <option value="friends">仅朋友可见</option>
                            <option value="private">仅自己可见</option>
                            <option value="custom">自定义分组</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <button class="btn btn-primary" onclick="publishMoments()">发布动态</button>
                    <button class="btn btn-success" onclick="generateMomentsAI()">AI生成</button>
                    <button class="btn btn-info" onclick="getMomentsInteraction()">查看互动</button>
                </div>
                
                <div class="test-result" id="momentsResult">
                    <div class="result-info">等待测试...</div>
                </div>
            </div>
            
            <!-- 关系网测试 -->
            <div class="test-card">
                <div class="card-header">
                    <div class="card-icon">🕸️</div>
                    <div>
                        <div class="card-title">关系网测试</div>
                        <div class="card-subtitle">人物关系，社交网络</div>
                    </div>
                </div>
                
                <div class="test-controls">
                    <div class="control-group">
                        <label class="control-label">关系类型</label>
                        <select class="control-select" id="relationshipType">
                            <option value="friend">朋友关系</option>
                            <option value="family">家庭关系</option>
                            <option value="colleague">同事关系</option>
                            <option value="romantic">恋爱关系</option>
                            <option value="mentor">师生关系</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">关系强度</label>
                        <input type="range" class="control-input" id="relationshipStrength" 
                               min="1" max="10" value="5" oninput="updateRelationshipValue(this.value)">
                        <span id="relationshipValue">5</span> / 10
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">互动历史</label>
                        <select class="control-select" id="interactionHistory">
                            <option value="frequent">频繁互动</option>
                            <option value="occasional">偶尔互动</option>
                            <option value="rare">很少互动</option>
                            <option value="new">新建关系</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <button class="btn btn-primary" onclick="analyzeRelationship()">分析关系</button>
                    <button class="btn btn-success" onclick="buildRelationshipNetwork()">构建网络</button>
                    <button class="btn btn-warning" onclick="predictRelationship()">关系预测</button>
                </div>
                
                <div class="test-result" id="relationshipResult">
                    <div class="result-info">等待测试...</div>
                </div>
            </div>
        </div>
        
        <div class="test-grid">
            <!-- 世界观测试 -->
            <div class="test-card">
                <div class="card-header">
                    <div class="card-icon">🌍</div>
                    <div>
                        <div class="card-title">世界观测试</div>
                        <div class="card-subtitle">背景设定，环境构建</div>
                    </div>
                </div>
                
                <div class="test-controls">
                    <div class="control-group">
                        <label class="control-label">世界类型</label>
                        <select class="control-select" id="worldType">
                            <option value="modern">现代都市</option>
                            <option value="fantasy">奇幻世界</option>
                            <option value="scifi">科幻未来</option>
                            <option value="historical">历史古代</option>
                            <option value="campus">校园生活</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">时间设定</label>
                        <input type="text" class="control-input" id="worldTime" 
                               placeholder="例如：2024年春天，下午3点" value="2024年春天，阳光明媚的下午">
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">地点描述</label>
                        <textarea class="control-textarea" id="worldLocation" 
                                  placeholder="描述具体地点...">一所现代化的大学校园，樱花盛开，学生们在草坪上休息聊天</textarea>
                    </div>
                </div>
                
                <div>
                    <button class="btn btn-primary" onclick="buildWorldView()">构建世界观</button>
                    <button class="btn btn-success" onclick="generateWorldEvents()">生成事件</button>
                    <button class="btn btn-info" onclick="getWorldStatus()">世界状态</button>
                </div>
                
                <div class="test-result" id="worldViewResult">
                    <div class="result-info">等待测试...</div>
                </div>
            </div>
            
            <!-- 剧情触发测试 -->
            <div class="test-card">
                <div class="card-header">
                    <div class="card-icon">🎭</div>
                    <div>
                        <div class="card-title">剧情触发测试</div>
                        <div class="card-subtitle">动态剧情，事件触发</div>
                    </div>
                </div>
                
                <div class="test-controls">
                    <div class="control-group">
                        <label class="control-label">剧情类型</label>
                        <select class="control-select" id="plotType">
                            <option value="romance">浪漫剧情</option>
                            <option value="adventure">冒险剧情</option>
                            <option value="mystery">悬疑剧情</option>
                            <option value="comedy">喜剧剧情</option>
                            <option value="drama">戏剧剧情</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">触发条件</label>
                        <select class="control-select" id="triggerCondition">
                            <option value="time">时间触发</option>
                            <option value="location">地点触发</option>
                            <option value="relationship">关系触发</option>
                            <option value="keyword">关键词触发</option>
                            <option value="random">随机触发</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">剧情强度</label>
                        <input type="range" class="control-input" id="plotIntensity" 
                               min="1" max="10" value="5" oninput="updatePlotValue(this.value)">
                        <span id="plotValue">5</span> / 10
                    </div>
                </div>
                
                <div>
                    <button class="btn btn-primary" onclick="triggerPlot()">触发剧情</button>
                    <button class="btn btn-success" onclick="generatePlotBranch()">生成分支</button>
                    <button class="btn btn-warning" onclick="getPlotHistory()">剧情历史</button>
                </div>
                
                <div class="test-result" id="plotResult">
                    <div class="result-info">等待测试...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let selectedGroupMembers = new Set(['xiaoyu']);
        let currentCharacter = 'xiaoyu';
        let testResults = {};
        
        // 角色数据
        const characters = {
            xiaoyu: {
                name: '小雨',
                avatar: '🤖',
                background: '温柔善良的AI助手，喜欢帮助他人，对世界充满好奇',
                personality: '温柔、善良、聪明、有耐心',
                interests: ['科技', '音乐', '阅读', '帮助他人']
            },
            xiaoming: {
                name: '小明',
                avatar: '👨‍🎓',
                background: '阳光开朗的大学生，计算机专业，热爱编程和游戏',
                personality: '开朗、活泼、聪明、有创造力',
                interests: ['编程', '游戏', '运动', '交友']
            },
            teacher_wang: {
                name: '王老师',
                avatar: '👩‍🏫',
                background: '经验丰富的教师，教授文学课程，关爱学生',
                personality: '严谨、关爱、有耐心、博学',
                interests: ['文学', '教育', '阅读', '写作']
            },
            doctor_li: {
                name: '李医生',
                avatar: '👨‍⚕️',
                background: '专业的医疗专家，内科医生，医术精湛',
                personality: '专业、严谨、负责、温和',
                interests: ['医学', '健康', '研究', '帮助患者']
            },
            artist_chen: {
                name: '陈画家',
                avatar: '🎨',
                background: '富有创意的艺术家，擅长油画和数字艺术',
                personality: '创意、敏感、浪漫、独立',
                interests: ['绘画', '艺术', '创作', '美学']
            }
        };
        
        // 工具函数
        function addResult(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const resultItem = document.createElement('div');
            resultItem.className = `result-item result-${type}`;
            resultItem.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong> - ${message}`;
            container.appendChild(resultItem);
            container.scrollTop = container.scrollHeight;
        }
        
        function clearResults(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '<div class="result-info">等待测试...</div>';
        }
        
        // 单聊测试功能
        function testSingleChat() {
            const character = document.getElementById('singleChatCharacter').value;
            const message = document.getElementById('singleChatMessage').value;
            
            clearResults('singleChatResult');
            addResult('singleChatResult', `开始与${characters[character].name}的单聊测试`, 'info');
            addResult('singleChatResult', `用户: ${message}`, 'success');
            
            // 模拟AI回复
            setTimeout(() => {
                const aiReply = generateAIReply(character, message);
                addResult('singleChatResult', `${characters[character].name}: ${aiReply}`, 'success');
                addResult('singleChatResult', '🔊 正在生成语音回复...', 'info');
                
                setTimeout(() => {
                    addResult('singleChatResult', '✅ 语音生成完成，自动播放', 'success');
                }, 1000);
            }, 1500);
        }
        
        function getCharacterBackground() {
            const character = document.getElementById('singleChatCharacter').value;
            const charData = characters[character];
            
            clearResults('singleChatResult');
            addResult('singleChatResult', `获取${charData.name}的角色背景`, 'info');
