name: yunai
description: YUNAI - AI 社交与创作平台

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # 路由导航
  go_router: ^12.1.3

  # 网络请求
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # 数据序列化
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # 本地存储
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 实时通信
  flutter_webrtc: ^0.9.48

  # UI 组件
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  file_picker: ^6.1.1

  # 工具库
  intl: ^0.19.0
  uuid: ^4.2.1
  crypto: ^3.0.3
  path_provider: ^2.1.1

  # 权限管理
  permission_handler: ^11.1.0

  # 设备信息
  device_info_plus: ^9.1.1
  package_info_plus: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

  # 代码检查
  flutter_lints: ^3.0.1

  # 测试工具
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/

  fonts:
    - family: PingFang
      fonts:
        - asset: assets/fonts/PingFang-Regular.ttf
        - asset: assets/fonts/PingFang-Medium.ttf
          weight: 500
        - asset: assets/fonts/PingFang-Bold.ttf
          weight: 700
